<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/admin/cms.css"><title>TOD — Content Studio</title><style>body{font:16px/1.6 system-ui;background:#f7f3ec;color:#333}#status{max-width:680px;margin:10vh auto;padding:30px}a{color:#8a6428}</style></head><body><div id="status"><h1>TOD Content Studio</h1><p>Loading editor…</p></div><script>window.CMS_MANUAL_INIT=true;Promise.all([fetch('/api/cms/config').then(async r=>{if(!r.ok)throw new Error('CMS setup is not complete. Set CMS_ENABLED, CMS_REPO and CMS_AUTH_URL, then redeploy. See README.');return r.json()}),fetch('/admin/schema.json').then(r=>r.json())]).then(([backend,schema])=>{schema.backend={...schema.backend,...backend};const script=document.createElement('script');script.src='/admin/decap-cms.js';script.onload=()=>{document.getElementById('status').remove();window.CMS.init({config:schema})};script.onerror=()=>{document.querySelector('#status p').textContent='Editor could not load. Please reload.'};document.body.appendChild(script)}).catch(e=>{document.querySelector('#status p').textContent=e.message})</script></body></html>
